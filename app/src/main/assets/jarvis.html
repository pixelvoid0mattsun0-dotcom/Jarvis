<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<style>
:root{--bg:#070402;--panel:#140c05;--line:#4a2e10;--cyan:#ffb347;--cyan-dim:#b0691c;--gold:#ffd88a;--text:#f6e6d0;--mute:#a58a6c;--danger:#ff6b6b}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Rajdhani","Bahnschrift","Segoe UI",system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);background:radial-gradient(ellipse at 50% 30%,#2b1606 0%,var(--bg) 64%)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
header h1{font-size:18px;font-weight:600;letter-spacing:.32em;color:var(--cyan)}
#status{font-size:14px;color:var(--mute);letter-spacing:.08em}
#status b{color:var(--gold);font-weight:600}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:6px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#gear{width:36px;height:36px;font-size:18px;color:var(--cyan-dim)}
#stage{flex:0 0 52%;min-height:240px;position:relative}
canvas{width:100%;height:100%;display:block;touch-action:none}
#stage::before,#stage::after{content:"";position:absolute;width:26px;height:26px;border:1.5px solid var(--cyan-dim);opacity:.8}
#stage::before{left:12px;top:4px;border-right:0;border-bottom:0}
#stage::after{right:12px;bottom:4px;border-left:0;border-top:0}
.ro{position:absolute;font-size:12px;line-height:1.35;color:var(--cyan-dim);letter-spacing:.06em;white-space:pre;pointer-events:none}
.ro.tl{left:18px;top:12px}.ro.br{right:18px;bottom:10px;text-align:right}
#log{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:10px;mask-image:linear-gradient(transparent,#000 24px)}
.m{max-width:88%;padding:8px 12px;font-size:17px;line-height:1.35;border-left:2px solid var(--cyan-dim);background:rgba(8,18,31,.8)}
.m.u{align-self:flex-end;border-left:0;border-right:2px solid var(--gold);color:#fff0d6;text-align:right}
.m.err{border-color:var(--danger);color:var(--danger)}
#bar{display:flex;gap:8px;padding:10px 12px 14px;align-items:center}
#txt{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--text);font:inherit;font-size:17px;padding:11px 12px}
#send{height:46px;padding:0 14px;color:var(--cyan)}
#mic{width:56px;height:56px;border-radius:50%;border:2px solid var(--cyan);color:var(--cyan);font-size:22px;flex:none;transition:box-shadow .2s,background .2s}
#mic.on{background:rgba(255,179,71,.15);box-shadow:0 0 0 6px rgba(255,179,71,.12),0 0 24px rgba(255,179,71,.5)}
dialog{max-height:90vh;overflow:auto;margin:auto;width:min(92vw,420px);background:var(--panel);color:var(--text);border:1px solid var(--cyan-dim);border-radius:8px;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h2{font-size:18px;color:var(--cyan);margin-bottom:12px;letter-spacing:.1em}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
dialog input,dialog select,dialog textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);font:inherit;font-size:16px;padding:9px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.row button{padding:8px 16px}
.row .pri{border-color:var(--cyan);color:var(--cyan)}
@media (prefers-reduced-motion:reduce){#mic{transition:none}}
</style>
</head>
<body>
<header>
  <h1>JARVIS</h1>
  <span id="status">Status: <b id="st">Idle</b></span>
  <button id="gear" aria-label="Settings">⚙</button>
</header>
<div id="stage"><canvas id="cv" aria-hidden="true"></canvas><span class="ro tl" id="ro1"></span><span class="ro br" id="ro2"></span></div>
<div id="log" aria-live="polite"></div>
<div id="bar">
  <input id="txt" type="text" placeholder="Type a command" autocomplete="off" aria-label="Command">
  <button id="send">Send</button>
  <button id="mic" aria-label="Talk to Jarvis">🎙</button>
</div>

<dialog id="dlg">
  <h2>Settings</h2>
  <label for="key">Groq API key</label>
  <input id="key" type="password" autocomplete="off" placeholder="gsk_...">
  <label for="model">Model</label>
  <select id="model">
    <option value="openai/gpt-oss-20b">gpt-oss-20b (fast)</option>
    <option value="openai/gpt-oss-120b">gpt-oss-120b (smarter)</option>
  </select>
  <label for="voice">Voice</label>
  <select id="voice"></select>
  <button id="test" type="button" style="margin-top:8px;padding:6px 12px">Test voice</button>
  <label for="contacts">Contacts (one per line, Name: number)</label>
  <textarea id="contacts" rows="4" placeholder="Mom: +15551234567"></textarea>
  <label for="lang">Speech language</label>
  <select id="lang"><option value="en-IN">English (India)</option><option value="en-US">English (US)</option><option value="en-GB">English (UK)</option><option value="hi-IN">Hindi</option></select>
  <label for="relay">Gmail relay URL (Apps Script web app)</label>
  <input id="relay" type="url" placeholder="https://script.google.com/macros/s/.../exec">
  <label for="secret">Relay secret</label>
  <input id="secret" type="password" autocomplete="off">
  <label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input id="hf" type="checkbox" style="width:auto"> Hands-free: keep listening after each reply</label>
  <div class="row"><button id="cancel">Cancel</button><button id="save" class="pri">Save</button></div>
</dialog>

<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var state="idle", amp=0, history=[];
function contactsMap(){var m={};load("jv_contacts","").split("\n").forEach(function(l){var i=l.search(/[:=]/);if(i>0){var n=l.slice(0,i).trim().toLowerCase(),v=l.slice(i+1).trim();if(n&&v)m[n]=v}});return m}
function sysPrompt(){var names=Object.keys(contactsMap()).join(", ");
return "You are JARVIS, a calm, dry-witted British AI butler. Address the user as sir. Reply ONLY with a JSON object: {\"say\":\"one to three short spoken sentences, no markdown\",\"action\":null or one of {\"type\":\"call\",\"to\":\"name or number\"} | {\"type\":\"sms\",\"to\":\"name or number\",\"body\":\"message text\"} | {\"type\":\"open_app\",\"app\":\"app name\"} | {\"type\":\"search\",\"query\":\"text\"} | {\"type\":\"navigate\",\"to\":\"place\"}}. More actions: {\"type\":\"whatsapp\",\"to\":\"name or number\",\"body\":\"text\"} | {\"type\":\"youtube\",\"query\":\"text\"} | {\"type\":\"set_alarm\",\"hour\":0-23,\"minute\":0-59,\"label\":\"text\"} | {\"type\":\"set_timer\",\"seconds\":number}. Email actions: {\"type\":\"read_email\",\"count\":1-10,\"query\":\"gmail search, default is:unread\"} | {\"type\":\"send_email\",\"to\":\"name or email address\",\"subject\":\"text\",\"body\":\"full email text\"}. Set action only when the user asks you to do that on the phone, otherwise null. In say, announce what you are doing in the present tense. Known contacts: "+(names||"none")+". Current date and time: "+new Date().toString()+"."}

/* ---------- storage (guarded) ---------- */
function load(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* ---------- state + UI ---------- */
function setState(s){
  state=s;
  $("st").textContent={idle:"Idle",listen:"Listening",think:"Thinking",speak:"Speaking"}[s];
  $("mic").classList.toggle("on",s==="listen");
}
function add(text,cls){
  var d=document.createElement("div");
  d.className="m "+(cls||"j");
  d.textContent=text;
  $("log").appendChild(d);
  $("log").scrollTop=1e9;
  return d;
}

/* ---------- speech out (male voice, chunked, speaks every reply) ---------- */
var voices=[],spkId=0,spkTimer=null;
function scoreVoice(v){
  var n=(v.name+" "+v.lang).toLowerCase(),sc=0;
  if(!/^en/i.test(v.lang))return -99;
  if(/gb|uk|british/.test(n))sc+=2;
  if(/female|zira|samantha|karen|susan|hazel|moira|tessa|victoria|fiona|serena|x-gba|x-gbc|x-iob|x-tpf|x-tpc|x-sfg|google us english/.test(n))sc-=6;
  else if(/daniel|david|james|george|arthur|oliver|male|alex|fred|mark|guy|ryan|rjs|x-gbb|x-gbd|x-iol|x-iom|x-tpd/.test(n))sc+=5;
  return sc;
}
function loadVoices(){
  voices=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  var sel=$("voice"),saved=load("jv_voice","");
  sel.innerHTML="";
  var auto=document.createElement("option");auto.value="";auto.textContent="Auto (male English)";sel.appendChild(auto);
  voices.forEach(function(v){var o=document.createElement("option");o.value=v.name;o.textContent=v.name+" ("+v.lang+")";sel.appendChild(o)});
  sel.value=saved;
}
function pickVoice(){
  var saved=load("jv_voice","");
  if(saved){for(var i=0;i<voices.length;i++)if(voices[i].name===saved)return{v:voices[i],sc:scoreVoice(voices[i])}}
  var best=null,bs=-50;
  voices.forEach(function(v){var c=scoreVoice(v);if(c>bs){bs=c;best=v}});
  return best?{v:best,sc:bs}:null;
}
function speak(text,done){
  var id=++spkId,fin=false;
  function end(){if(fin||id!==spkId)return;fin=true;clearTimeout(spkTimer);setState("idle");if(done)done()}
  clearTimeout(spkTimer);
  if(!window.speechSynthesis){setState("speak");setTimeout(end,Math.min(4000,text.length*60));return}
  try{speechSynthesis.cancel()}catch(e){}
  var pv=pickVoice(),v=pv&&pv.v,male=!!pv&&pv.sc>0;
  var parts=text.match(/[^.!?]+[.!?]*\s*/g)||[text],chunks=[],cur="";
  parts.forEach(function(p){if((cur+p).length>170&&cur){chunks.push(cur);cur=p}else cur+=p});
  if(cur)chunks.push(cur);
  var idx=0;
  function next(){
    if(id!==spkId)return;
    if(idx>=chunks.length){end();return}
    var u=new SpeechSynthesisUtterance(chunks[idx++].trim());
    if(v){u.voice=v;u.lang=v.lang}else u.lang="en-GB";
    u.pitch=male?.85:.55;u.rate=1;u.volume=1;
    u.onstart=function(){if(id===spkId)setState("speak")};
    u.onend=next;u.onerror=end;
    speechSynthesis.speak(u);
  }
  setTimeout(next,80);
  spkTimer=setTimeout(end,Math.max(6000,text.length*120));
}
if(window.speechSynthesis){
  loadVoices();speechSynthesis.onvoiceschanged=loadVoices;
  var vp=0,vi=setInterval(function(){if(voices.length||++vp>20)clearInterval(vi);else loadVoices()},500);
  document.addEventListener("pointerdown",function(){try{var u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}},{once:true});
}
$("test").onclick=function(){store("jv_voice",$("voice").value);speak("Good day, sir. Voice check complete.")};

/* ---------- phone control ---------- */
var PK_APPS={whatsapp:"com.whatsapp",youtube:"com.google.android.youtube",spotify:"com.spotify.music",instagram:"com.instagram.android",facebook:"com.facebook.katana",telegram:"org.telegram.messenger",chrome:"com.android.chrome",gmail:"com.google.android.gm",maps:"com.google.android.apps.maps",photos:"com.google.android.apps.photos","play store":"com.android.vending",twitter:"com.twitter.android",x:"com.twitter.android",snapchat:"com.snapchat.android",tiktok:"com.zhiliaoapp.musically",netflix:"com.netflix.mediaclient",calculator:"com.google.android.calculator",contacts:"com.google.android.contacts",calendar:"com.google.android.calendar"};
function intentUrl(extra){return "intent:#Intent;"+extra+";end"}
function appUrl(name){
  var n=String(name||"").toLowerCase().replace(/^the\s+/,"").replace(/\s+app$/,"").trim();
  if(n==="camera")return intentUrl("action=android.media.action.IMAGE_CAPTURE");
  if(n==="settings")return intentUrl("action=android.settings.SETTINGS");
  if(n==="clock"||n==="alarm")return intentUrl("action=android.intent.action.SHOW_ALARMS");
  if(n==="phone"||n==="dialer")return "tel:";
  if(n==="messages"||n==="sms")return "sms:";
  if(n==="email"||n==="mail")return "mailto:";
  var pk=PK_APPS[n];
  return pk?intentUrl("action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package="+pk):null;
}
function resolveNumber(to){
  var t=String(to||"").trim();
  if(/^\+?[\d][\d\s\-().]{2,}$/.test(t))return t.replace(/[\s\-().]/g,"");
  var m=contactsMap(),k=t.toLowerCase();
  if(m[k])return m[k].replace(/[\s\-().]/g,"");
  for(var n in m){if(k.indexOf(n)>-1||n.indexOf(k)>-1)return m[n].replace(/[\s\-().]/g,"")}
  return null;
}
function fire(url){
  if(/^https?:/i.test(url)){var w=window.open(url,"_blank");if(!w)location.href=url;return}
  try{location.href=url}catch(e){}
}

function relay(q,body){var u=load("jv_relay",""),k=load("jv_secret","");
  if(!u)return Promise.reject(new Error("Gmail relay is not set. Open settings, sir."));
  var url=u+(u.indexOf("?")>-1?"&":"?")+"s="+encodeURIComponent(k)+"&"+q;
  return fetch(url,body?{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(body)}:{}).then(function(r){return r.json()}).then(function(j){if(j.error)throw new Error(j.error);return j})}
function emailAddr(t){t=String(t||"").trim();if(/^\S+@\S+\.\S+$/.test(t))return t;var m=contactsMap(),k=t.toLowerCase();
  for(var n in m){if(/@/.test(m[n])&&(n===k||k.indexOf(n)>-1||n.indexOf(k)>-1))return m[n]}return null}
function emailAction(a){
  if(a.type==="read_email"){setState("think");
    relay("a=inbox&n="+(parseInt(a.count,10)||5)+"&q="+encodeURIComponent(a.query||"is:unread in:inbox")).then(function(j){
      var t=j.mails||[],x=t.length?"You have "+t.length+" message"+(t.length>1?"s":"")+", sir. "+t.map(function(m,i){return (i+1)+". From "+m.from+": "+m.subject+". "+m.snippet}).join(" "):"No matching email, sir.";
      add(x);speak(x)}).catch(function(e){add(e.message,"err");speak("I couldn’t reach your mail, sir.")});return}
  var to=emailAddr(a.to);
  if(!to){var m1="I don’t have an email address for "+(a.to||"that contact")+", sir. Add it under Contacts as Name: address.";add(m1,"err");speak(m1);return}
  var d=document.createElement("div");d.className="m";
  var h=document.createElement("div");h.textContent="To: "+to+"\nSubject: "+(a.subject||"(none)")+"\n\n"+(a.body||"");h.style.whiteSpace="pre-wrap";d.appendChild(h);
  var b=document.createElement("button"),c=document.createElement("button");b.textContent="Send";c.textContent="Cancel";b.style.cssText=c.style.cssText="padding:6px 14px;margin:8px 8px 0 0";b.style.color="var(--gold)";
  b.onclick=function(){b.disabled=c.disabled=true;relay("a=send",{to:to,subject:a.subject||"",body:a.body||""}).then(function(){add("Email sent, sir.");speak("Email sent, sir.")}).catch(function(e){add(e.message,"err")})};
  c.onclick=function(){d.remove()};d.appendChild(b);d.appendChild(c);$("log").appendChild(d);$("log").scrollTop=1e9}
function runAction(a){
  var url=null,label="",enc=encodeURIComponent;
  if(a.type==="read_email"||a.type==="send_email"){emailAction(a);return}
  if(a.type==="call"||a.type==="sms"){
    var num=resolveNumber(a.to);
    if(!num){var msg="I don’t have a number for "+(a.to||"that contact")+", sir. Add it under Contacts in settings.";add(msg,"err");speak(msg);return}
    url=a.type==="call"?"tel:"+num:"sms:"+num+"?body="+enc(a.body||"");
    label=(a.type==="call"?"Call ":"Text ")+a.to;
  }else if(a.type==="open_app"){
    url=appUrl(a.app);label="Open "+a.app;
    if(!url){var m2="I don’t know how to open "+a.app+" yet, sir.";add(m2,"err");speak(m2);return}
  }else if(a.type==="search"){url="https://www.google.com/search?q="+enc(a.query||"");label="Search: "+a.query}
  else if(a.type==="navigate"){url="google.navigation:q="+enc(a.to||"");label="Navigate to "+a.to}
  else if(a.type==="whatsapp"){var wn=resolveNumber(a.to);
    if(!wn){var m3="I don’t have a number for "+(a.to||"that contact")+", sir. Add it under Contacts in settings.";add(m3,"err");speak(m3);return}
    url="https://wa.me/"+wn.replace(/\D/g,"")+"?text="+enc(a.body||"");label="WhatsApp "+a.to}
  else if(a.type==="youtube"){url="https://www.youtube.com/results?search_query="+enc(a.query||"");label="YouTube: "+a.query}
  else if(a.type==="set_alarm"){var hh=parseInt(a.hour,10),mi=parseInt(a.minute,10)||0;if(!(hh>=0&&hh<24)||!(mi>=0&&mi<60))return;
    url=intentUrl("action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR="+hh+";i.android.intent.extra.alarm.MINUTES="+mi+";S.android.intent.extra.alarm.MESSAGE="+enc(a.label||"Jarvis"));label="Alarm "+hh+":"+(mi<10?"0":"")+mi}
  else if(a.type==="set_timer"){var sec=parseInt(a.seconds,10);if(!(sec>0&&sec<86400))return;
    url=intentUrl("action=android.intent.action.SET_TIMER;i.android.intent.extra.alarm.LENGTH="+sec);label="Timer "+sec+" seconds"}
  else return;
  var d=document.createElement("div");d.className="m";
  var l=document.createElement("a");l.href=url;l.textContent="▶ "+label+" (tap if it didn’t open)";l.style.color="var(--gold)";
  if(/^https?:/i.test(url))l.target="_blank";
  d.appendChild(l);$("log").appendChild(d);$("log").scrollTop=1e9;
  fire(url);
}

function getModel(){var m=load("jv_model","");return m==="openai/gpt-oss-120b"?m:"openai/gpt-oss-20b"}
function parseJ(raw){var a=raw.indexOf("{"),b=raw.lastIndexOf("}");if(a<0||b<a)throw 0;return JSON.parse(raw.slice(a,b+1))}
/* ---------- brain (Groq) ---------- */
async function ask(text){
  var key=load("jv_key","");
  if(!key){add("No API key set. Open settings and add your Groq key.","err");$("dlg").showModal();return}
  add(text,"u");
  history.push({role:"user",content:text});
  history=history.slice(-12);
  setState("think");
  try{
    var r=await fetch("https://api.groq.com/openai/v1/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
      body:JSON.stringify({model:getModel(),temperature:.5,max_tokens:1200,reasoning_effort:"low",response_format:{type:"json_object"},
        messages:[{role:"system",content:sysPrompt()}].concat(history)})
    });
    if(!r.ok)throw new Error(r.status===401?"The Groq key was rejected. Check it in settings.":r.status===404?"That AI model is unavailable. Open settings and pick another model, sir.":r.status===429?"Groq says too many requests. Wait a moment, sir.":"Groq returned error "+r.status+".");
    var j=await r.json();
    var raw=(j.choices&&j.choices[0].message.content||"").trim(),say=raw,act=null;
    history.push({role:"assistant",content:raw});
    try{var o=parseJ(raw);say=String(o.say||o.reply||"").trim();act=o.action||null}catch(e){}
    if(!say)say="Right away, sir.";
    add(say);
    speak(say,function(){var has=act&&act.type&&act.type!=="none";if(has)runAction(act);else if(load("jv_hf","")==="1")setTimeout(listen,350)});
  }catch(e){
    add(e.message||"Network error. Check your connection.","err");
    setState("idle");
  }
}

/* ---------- speech in ---------- */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition, rec=null;
function listen(){
  if(!SR){add("Speech recognition isn’t available here. Type your command instead.","err");return}
  if(state==="listen"){rec&&rec.stop();return}
  spkId++;if(window.speechSynthesis)speechSynthesis.cancel();
  rec=new SR();rec.lang=load("jv_lang","en-IN");rec.interimResults=false;
  var got=false;
  rec.onstart=function(){setState("listen")};
  rec.onresult=function(e){got=true;ask(e.results[0][0].transcript)};
  rec.onerror=function(e){if(e.error==="not-allowed")add("Microphone is blocked. Open Jarvis from http://localhost:8080 or an https link, or allow the mic for this site in Chrome settings.","err")};
  rec.onend=function(){if(!got&&state==="listen")setState("idle")};
  try{rec.start()}catch(e){setState("idle")}
}

/* ---------- inputs ---------- */
function submit(){var t=$("txt").value.trim();if(!t)return;$("txt").value="";ask(t)}
$("send").onclick=submit;
$("txt").onkeydown=function(e){if(e.key==="Enter")submit()};
$("mic").onclick=listen;
$("gear").onclick=function(){$("key").value=load("jv_key","");$("model").value=getModel();$("voice").value=load("jv_voice","");$("contacts").value=load("jv_contacts","");$("lang").value=load("jv_lang","en-IN");$("hf").checked=load("jv_hf","")==="1";$("relay").value=load("jv_relay","");$("secret").value=load("jv_secret","");$("dlg").showModal()};
$("cancel").onclick=function(){$("dlg").close()};
$("save").onclick=function(){store("jv_key",$("key").value.trim());store("jv_model",$("model").value);store("jv_voice",$("voice").value);store("jv_contacts",$("contacts").value);store("jv_lang",$("lang").value);store("jv_hf",$("hf").checked?"1":"");store("jv_relay",$("relay").value.trim());store("jv_secret",$("secret").value.trim());$("dlg").close()};

/* ---------- HUD: true 3D model (software projection, drag to rotate) ---------- */
var cv=$("cv"),cx=cv.getContext("2d"),W=0,H=0,t=0,spin=1,boot=0,burst=0,lastWave=0;
var ry=0.6,rx=0.35,vx=0,vy=0,drag=false,lx=0,ly=0,moved=0;
var cY=1,sY=0,cX=1,sX=0,F=1,PX=0,PY=0,PZ=0,PK=1;
